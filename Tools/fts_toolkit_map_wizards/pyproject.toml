[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fts-toolkit-map-wizards"
version = "0.2.0-alpha.2"
description = "Fantasy Trade Simulator map hierarchy CLI wizards."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "typer>=0.12.0"
]

[project.scripts]
fts-toolkit = "fts_toolkit.cli:app"

[tool.setuptools.packages.find]
include = ["fts_toolkit*"]
exclude = ["exports*", "tests*", "docs*"]
